name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      # Next generates global types (e.g. LayoutProps) into the git-ignored
      # .next/types. A clean checkout has none, so generate them before tsc.
      - run: npx next typegen

      - run: npx tsc --noEmit

      # No database or secrets in CI: the DB-backed tests skip themselves
      # unless TEST_DATABASE_URL is set, and `next build` does not connect.
      - run: npm test

      - run: npm run build
